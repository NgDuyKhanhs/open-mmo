spring:
  application:
    name: ai
  
  # MongoDB Configuration
  data:
    mongodb:
      uri: mongodb://localhost:27017/openmmo
      database: openmmo
      auto-index-creation: true
  
  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

# Server Configuration
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ==============================================
# JWT Configuration
# ==============================================
jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIGxvbmcgand0IHNlY3JldCBrZXkgdGhhdCBzaG91bGQgYmUgYXQgbGVhc3QgMjU2IGJpdHMgZm9yIEhTNTEyIHNpZ25hdHVyZSBhbGdvcml0aG0gYW5kIGluIHByb2R1Y3Rpb24gdXNlIGEgc3Ryb25nIHJhbmRvbSBrZXk=}
  expiration: 86400000
  refresh:
    expiration: 604800000

# ==============================================
# OAuth2 Google Configuration
# ==============================================
oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:779295627515-28h679li4r6e3mkjn5hspm7g7nqatjre.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET:GOCSPX-example-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/api/v1/auth/google-callback}

# ==============================================
# CORS Configuration  
# ==============================================
cors:
  allowed-origins: ${CORS_ORIGINS:*}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: Authorization,Content-Type,X-Requested-With
  allow-credentials: true
  max-age: 3600

# ==============================================
# Logging Configuration
# ==============================================
logging:
  level:
    org.springframework.data.mongodb: DEBUG
    org.springframework.boot.autoconfigure: INFO
    org.springframework.security: DEBUG
    com.openmmo.ai: DEBUG
  format:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# ==============================================
# Application Configuration
# ==============================================
app:
  name: OpenMMO AI Backend
  description: AI integration backend for OpenMMO
  version: 1.0.0-beta

