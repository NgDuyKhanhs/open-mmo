spring:
  application:
    name: ai
  
  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/openmmo}
      database: ${MONGODB_DATABASE:openmmo}
      auto-index-creation: true
  
  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ==============================================
# JWT Configuration
# ==============================================
# Set JWT_SECRET environment variable (required for production)
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  refresh:
    expiration: 604800000

# ==============================================
# OAuth2 Google Configuration
# ==============================================
# Set APP_API_URL environment variable to base URL only:
# Local: http://localhost:8080
# Prod: https://app.openmmo.ai
oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${APP_API_URL:http://localhost:8080}/api/v1/auth/google-callback

# ==============================================
# Gmail OAuth Configuration
# ==============================================
# Set APP_API_URL environment variable to base URL only:
# Local: http://localhost:8080
# Prod: https://app.openmmo.ai
gmail:
  oauth:
    redirect-uri: ${APP_API_URL:http://localhost:8080}/api/v1/gmail/connect/callback
  api:
    base: ${GMAIL_API_BASE:https://www.googleapis.com/gmail/v1/users/me}
  app-web-url: ${APP_WEB_URL:http://localhost:5173}

# ==============================================
# CORS Configuration  
# ==============================================
# For local: allow "*" with allow-credentials=false
# For prod: set CORS_ORIGINS explicitly with allow-credentials=true
cors:
  allowed-origins: ${CORS_ORIGINS:*}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: Authorization,Content-Type,X-Requested-With
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  max-age: 3600

# ==============================================
# Logging Configuration
# ==============================================
logging:
  level:
    org.springframework.data.mongodb: ${LOG_LEVEL_MONGODB:DEBUG}
    org.springframework.boot.autoconfigure: ${LOG_LEVEL_BOOT:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:DEBUG}
    com.openmmo.ai: ${LOG_LEVEL:DEBUG}
  format:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n"

# ==============================================
# Application Configuration
# ==============================================
app:
  name: OpenMMO AI Backend
  description: AI integration backend for OpenMMO
  version: 1.0.0-beta
  web-url: ${APP_WEB_URL:http://localhost:5173}

# ==============================================
# Token Encryption
# ==============================================
token:
  enc:
    key-base64: ${TOKEN_ENC_KEY_BASE64:}

# ==============================================
# Gemini Configuration
# ==============================================
gemini:
  api-key: ${GEMINI_API_KEY:}

