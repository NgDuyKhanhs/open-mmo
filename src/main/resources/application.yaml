spring:
  application:
    name: ai
  
  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/openmmo}
      database: ${NAMEDB:openmmo}
      auto-index-creation: true
  
  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ==============================================
# JWT Configuration
# ==============================================
# IMPORTANT: In production, set JWT_SECRET environment variable
# Default below is 512-bit secret for HS512 algorithm
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  refresh:
    expiration: 604800000

# ==============================================
# OAuth2 Google Configuration
# ==============================================
# Set APP_API_URL environment variable to override:
# Example: APP_API_URL=https://app.openmmo.ai
oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${APP_API_URL:http://localhost:8080}/api/v1/auth/google-callback

# ==============================================
# Gmail OAuth Configuration
# ==============================================
# Set APP_API_URL environment variable to override:
# Example: APP_API_URL=https://app.openmmo.ai
gmail:
  oauth:
    redirect-uri: ${APP_API_URL:http://localhost:8080}/api/v1/gmail/connect/callback
  api:
    base: ${GMAIL_API_BASE:https://www.googleapis.com/gmail/v1/users/me}
  app-web-url: ${APP_WEB_URL:http://localhost:5173}

# ==============================================
# CORS Configuration  
# ==============================================
# When allowCredentials is true, allowedOrigins cannot be "*"
# Use allowedOriginPatterns instead
# Set CORS_ORIGINS environment variable for deployment
# Example: CORS_ORIGINS=https://app.openmmo.ai,https://www.openmmo.ai
cors:
  allowed-origins: ${CORS_ORIGINS:*}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: Authorization,Content-Type,X-Requested-With
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  max-age: 3600

# ==============================================
# Logging Configuration
# ==============================================
logging:
  level:
    org.springframework.data.mongodb: DEBUG
    org.springframework.boot.autoconfigure: INFO
    org.springframework.security: DEBUG
    com.openmmo.ai: DEBUG
  format:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# ==============================================
# Application Configuration
# ==============================================
app:
  name: OpenMMO AI Backend
  description: AI integration backend for OpenMMO
  version: 1.0.0-beta
  web-url: ${APP_WEB_URL:http://localhost:5173}

# ==============================================
# Token Encryption
# ==============================================
token:
  enc:
    key-base64: ${TOKEN_ENC_KEY_BASE64:}

# ==============================================
# Gemini Configuration
# ==============================================
gemini:
  api-key: ${GEMINI_API_KEY:}

