spring:
  application:
    name: ai

  # MongoDB Configuration - Local Development
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/openmmo}
      database: ${MONGODB_DATABASE:openmmo}
      auto-index-creation: true

  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ==============================================
# JWT Configuration
# ==============================================
# LOCAL ONLY - Updated with 512-bit secret for HS512 algorithm
# Secret: dk1qrTUJeUPfeJaog/lsC7P9i27rla7514968Ib0v61mEv7t15gp1/Bvo6WSjrqyfBsTednLTrMg8VvqKLCRxw==
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  refresh:
    expiration: 604800000

# ==============================================
# OAuth2 Google Configuration
# ==============================================
# Set APP_API_URL environment variable to override:
# Example: APP_API_URL=https://app.openmmo.ai
oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${APP_API_URL:http://localhost:8080}/api/v1/auth/google-callback

# ==============================================
# CORS Configuration
# ==============================================
# For local development: allow localhost origins without credentials issues
# allowCredentials is false to avoid CORS wildcard/pattern conflicts
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: Authorization,Content-Type,X-Requested-With
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  max-age: 3600

# ==============================================
# Logging Configuration - Development
# ==============================================
logging:
  level:
    root: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.openmmo.ai: DEBUG
    org.springaicommunity: DEBUG
  format:
    console: "[%d{yyyy-MM-dd HH:mm:ss}] [%thread] [%level] %logger{36} - %msg%n"

# ==============================================
# Application Configuration
# ==============================================
app:
  name: OpenMMO AI Backend
  description: AI integration backend for OpenMMO - Make Money Online Platform
  version: 1.0.0-beta
  web-url: ${APP_WEB_URL:http://localhost:5173}

# ==============================================
# Gmail Configuration
# ==============================================
gmail:
  oauth:
    redirect-uri: ${APP_API_URL:http://localhost:8080}/api/v1/gmail/connect/callback

# ==============================================
# Token Encryption
# ==============================================
token:
  enc:
    key-base64: ${TOKEN_ENC_KEY_BASE64:}

# ==============================================
# Gemini Configuration
# ==============================================
gemini:
  api-key: ${GEMINI_API_KEY:}
