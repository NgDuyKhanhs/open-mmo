spring.application.name=ai

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/openmmo
spring.data.mongodb.database=openmmo
spring.data.mongodb.auto-index-creation=true

# Spring AI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:}

# Server Configuration
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT Configuration
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIGxvbmcgand0IHNlY3JldCBrZXkgdGhhdCBzaG91bGQgYmUgYXQgbGVhc3QgMjU2IGJpdHMgZm9yIEhTNTEyIHNpZ25hdHVyZSBhbGdvcml0aG0gYW5kIGluIHByb2R1Y3Rpb24gdXNlIGEgc3Ryb25nIHJhbmRvbSBrZXk=}
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# OAuth2 Google Configuration
oauth2.google.client-id=${GOOGLE_CLIENT_ID:779295627515-28h679li4r6e3mkjn5hspm7g7nqatjre.apps.googleusercontent.com}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:GOCSPX-example-secret}
oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/api/v1/auth/google-callback}

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:*}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=Authorization,Content-Type,X-Requested-With
cors.allow-credentials=true
cors.max-age=3600

# Logging Configuration
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.openmmo.ai=DEBUG
logging.format.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Application Configuration
app.name=OpenMMO AI Backend
app.description=AI integration backend for OpenMMO
app.version=1.0.0-beta
